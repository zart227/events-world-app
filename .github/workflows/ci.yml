name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @events-world/backend

      - name: Typecheck
        run: npm run typecheck -w @events-world/backend

      - name: Generate Prisma Client
        run: npm run db:generate -w @events-world/backend

      - name: Tests (testcontainers)
        run: npm test -w @events-world/backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @events-world/frontend
        env:
          CI: 'false'
